version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toy_store
    ports:
      - "8000:80"          # Apache / Laravel
      - "5173:5173"        # Vite dev server
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: toy_store_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: toy_store
      MYSQL_USER: rufi
      MYSQL_PASSWORD: rufi
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%' 
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  node_modules:
